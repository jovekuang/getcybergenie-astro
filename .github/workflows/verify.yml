name: Verify Cyber Genie
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:showcase
      - name: Verify published motion assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm run check:motion
      - run: npm run review:case-studies:build
      - run: npm run check:case-study-boundary
      - run: npm run check:draft-motion
      - run: npx playwright install --with-deps chromium
      - name: Verify pending showcase playback locally
        shell: bash
        run: |
          npm run review:case-studies > /tmp/story-review.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4347/_review/case-studies/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/story-review.log; exit 1; fi
          npm run test:draft-browser
      - name: Verify Pages runtime and customer journeys
        shell: bash
        run: |
          npm run dev:pages > /tmp/pages-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/pages-preview.log; exit 1; fi
          npm run test:runtime
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-preview-log
          path: /tmp/pages-preview.log
