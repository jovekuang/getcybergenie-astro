name: Verify Cyber Genie
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Verify Pages runtime and customer journeys
        shell: bash
        run: |
          npm run dev:pages > /tmp/pages-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/pages-preview.log; exit 1; fi
          npm run test:runtime
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-preview-log
          path: /tmp/pages-preview.log
